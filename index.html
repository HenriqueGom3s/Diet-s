<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diet's</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef4ec;--ink:#16301f;--g1:#1f6b43;--g2:#2f8f5b;--g3:#d3e7d7;--sun:#f2b705;--card:#fff;--mut:#5b7263;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Nunito Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0 0 .5rem;line-height:1.15}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--g3)}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #b9d3bf;width:100%;margin:4px 0 10px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--g1);color:#fff;border:0;font-weight:700}
button.sec{background:var(--g3);color:var(--g1)}
button.red{background:var(--err)}
button.sm{width:auto;padding:6px 12px;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
label{font-weight:600;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--g3);border-radius:12px;padding:12px}
.stat b{display:block;font:800 1.6rem 'Bricolage Grotesque',sans-serif;color:var(--g1)}
header{background:var(--g1);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:1.6rem;margin:0}
header h1 span{color:var(--sun)}
header button{background:transparent;border:1px solid #fff8;width:auto;margin:0;padding:6px 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button,.days button{width:auto;margin:0;background:var(--g3);color:var(--g1);padding:8px 14px}
nav button.on,.days button.on{background:var(--g1);color:#fff}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.meal{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--g3)}
.meal:last-child{border:0}
.meal small{color:var(--mut);display:block}
.tag{display:inline-block;background:var(--sun);color:#3a2d00;border-radius:8px;padding:1px 8px;font-size:.8rem;font-weight:700}
.msg{color:var(--err);min-height:1.4em;font-weight:600}
.ok{color:var(--g1)}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--g3);font-size:.92rem}
#auth{max-width:420px;margin:7vh auto}
@media(max-width:520px){.meal{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="auth" class="wrap">
  <div class="card">
    <h1>Diet's</h1>
    <p>Sua dieta com a comida do dia a dia do brasileiro.</p>
    <label for="em">E-mail</label><input id="em" type="email" autocomplete="email">
    <label for="sn">Senha</label><input id="sn" type="password" autocomplete="current-password">
    <button onclick="entrar()">Entrar</button>
    <button class="sec" onclick="cadastrar()">Criar conta</button>
    <button class="sec" onclick="loginGoogle()">Entrar com Google</button>
    <button class="sec" onclick="recuperar()">Esqueci minha senha</button>
    <div id="amsg" class="msg" role="alert"></div>
  </div>
</div>

<div id="app" hidden>
  <header><div class="wrap"><h1>Diet's<span>.</span></h1><span id="quem"></span><button onclick="sair()">Sair</button></div></header>
  <div class="wrap">
    <nav id="nav">
      <button data-t="dieta" class="on">Dieta</button>
      <button data-t="prog">Progresso</button>
      <button data-t="perfil">Perfil</button>
      <button data-t="admin" id="tabadm" hidden>Admin</button>
    </nav>

    <section id="t-dieta">
      <div class="card"><div class="grid" id="stats"></div></div>
      <div class="card"><h2>Dieta da semana</h2><div class="days" id="days"></div><div id="meals"></div></div>
    </section>

    <section id="t-prog" hidden>
      <div class="card"><h2>Registrar peso</h2>
        <label for="pnovo">Peso de hoje (kg)</label><input id="pnovo" type="number" step="0.1">
        <button onclick="addPeso()">Salvar peso</button><div id="pmsg" class="msg"></div></div>
      <div class="card"><h2>Evolução</h2><div id="chart"></div><div id="plist"></div></div>
    </section>

    <section id="t-perfil" hidden>
      <div class="card"><h2>Meu perfil</h2><div id="pfmsg" class="msg"></div>
        <label for="f-nome">Nome</label><input id="f-nome">
        <div class="grid">
          <div><label for="f-sexo">Sexo</label><select id="f-sexo"><option value="F">Feminino</option><option value="M">Masculino</option></select></div>
          <div><label for="f-idade">Idade</label><input id="f-idade" type="number"></div>
          <div><label for="f-altura">Altura (cm)</label><input id="f-altura" type="number"></div>
          <div><label for="f-peso">Peso (kg)</label><input id="f-peso" type="number" step="0.1"></div>
        </div>
        <label for="f-ativ">Atividade física</label>
        <select id="f-ativ"><option value="1.2">Sedentário</option><option value="1.375">Leve (1-3x por semana)</option><option value="1.55">Moderada (3-5x por semana)</option><option value="1.725">Intensa (6-7x por semana)</option></select>
        <label for="f-obj">Objetivo</label>
        <select id="f-obj"><option value="emagrecer">Emagrecer</option><option value="manter">Manter o peso</option><option value="ganhar">Ganhar massa</option></select>
        <button onclick="salvarPerfil()">Salvar perfil</button>
      </div>
    </section>

    <section id="t-admin" hidden>
      <div class="card"><h2>Usuários</h2><div id="ulist"></div></div>
    </section>
  </div>
</div>

<script>
// ====== CONFIGURE AQUI ======
const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';
const SUPABASE_KEY = 'SUA-ANON-KEY';
const SITE = 'https://henriquegom3s.github.io/Diet-s/';
// ============================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U = null, P = null, day = 0;

/* ---------- Receitas (culinária brasileira) [nome, kcal da porção base, descrição] ---------- */
const R = {
cafe: [
 ['Pão com ovo mexido e café com leite',420,'1 pão francês, 2 ovos mexidos, 1 xícara de café com leite'],
 ['Pão com queijo minas e mamão',380,'1 pão francês, 2 fatias de queijo minas, 1 fatia de mamão'],
 ['Tapioca com queijo e café',350,'1 tapioca média, 2 fatias de queijo, café sem açúcar'],
 ['Cuscuz com ovo e leite',410,'1 fatia de cuscuz, 2 ovos, 1 copo de leite'],
 ['Iogurte com banana e aveia',330,'1 pote de iogurte natural, 1 banana, 2 col. de sopa de aveia'],
 ['Pão integral com requeijão e laranja',390,'2 fatias de pão integral, 1 col. de requeijão, 1 laranja'],
 ['Mingau de aveia com banana',340,'3 col. de sopa de aveia, 1 copo de leite, 1 banana']],
lanche: [
 ['Banana com aveia',150,'1 banana e 1 col. de sopa de aveia'],
 ['Iogurte natural com mel',140,'1 pote de iogurte e 1 col. de chá de mel'],
 ['Maçã e castanhas',160,'1 maçã e 3 castanhas-do-pará'],
 ['Pão de queijo e café',200,'2 pães de queijo pequenos e café sem açúcar'],
 ['Mamão com granola',160,'1 fatia de mamão e 2 col. de sopa de granola'],
 ['Queijo minas com goiaba',150,'2 fatias de queijo minas e 1 goiaba'],
 ['Vitamina de banana',220,'1 copo de leite batido com 1 banana'],
 ['Laranja e biscoito de água e sal',140,'1 laranja e 4 biscoitos']],
almoco: [
 ['Arroz, feijão, bife acebolado e salada',650,'4 col. de sopa de arroz, 1 concha de feijão, 1 bife (120 g) com cebola, salada de alface e tomate'],
 ['Arroz, feijão, frango grelhado e legumes',600,'4 col. de arroz, 1 concha de feijão, 1 filé de frango (120 g), cenoura e chuchu'],
 ['Arroz, feijão, carne moída e couve',640,'4 col. de arroz, 1 concha de feijão, 4 col. de carne moída, couve refogada'],
 ['Arroz, feijão, tilápia assada e salada',580,'4 col. de arroz, 1 concha de feijão, 1 filé de tilápia, salada de tomate'],
 ['Arroz, feijão, omelete e salada',560,'4 col. de arroz, 1 concha de feijão, omelete de 2 ovos, salada de alface'],
 ['Arroz, feijão, picadinho com legumes',650,'4 col. de arroz, 1 concha de feijão, picadinho de carne com batata e cenoura'],
 ['Arroz, feijão, frango ensopado com batata',620,'4 col. de arroz, 1 concha de feijão, 2 pedaços de frango ensopado com batata'],
 ['Macarrão ao sugo com carne moída e salada',620,'1 prato de macarrão com molho de tomate e carne moída, salada de alface']],
jantar: [
 ['Sopa de legumes com frango desfiado',380,'1 prato fundo de sopa com cenoura, batata, chuchu e frango'],
 ['Omelete com tomate e arroz',450,'omelete de 2 ovos com tomate, 3 col. de arroz'],
 ['Arroz, feijão, ovo e salada',480,'3 col. de arroz, 1 concha de feijão, 1 ovo frito ou cozido, salada'],
 ['Sanduíche natural de frango',420,'2 fatias de pão, frango desfiado, queijo, alface e tomate'],
 ['Caldo verde',400,'1 prato de caldo de batata com couve e 2 rodelas de linguiça'],
 ['Tapioca de frango com queijo',430,'1 tapioca com frango desfiado e queijo'],
 ['Peixe grelhado com purê e salada',470,'1 filé de peixe, 4 col. de purê de batata, salada']],
ceia: [
 ['Chá de camomila com torradas',100,'1 xícara de chá e 2 torradas'],
 ['Leite morno',120,'1 copo de leite morno'],
 ['Iogurte natural',100,'1 pote pequeno'],
 ['Mamão',90,'1 fatia média']]
};
const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const N6 = ['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia'];
const S6 = ['cafe','lanche','almoco','lanche','jantar','ceia'], P6 = [.25,.10,.30,.10,.20,.05];
const N5 = N6.slice(0,5), S5 = S6.slice(0,5), P5 = [.25,.10,.33,.10,.22];

/* ---------- Cálculos ---------- */
function calc(p){
  const tmb = 10*p.peso + 6.25*p.altura - 5*p.idade + (p.sexo==='M'?5:-161);
  const tdee = tmb*p.atividade;
  let meta = p.objetivo==='emagrecer' ? tdee-500 : p.objetivo==='ganhar' ? tdee+300 : tdee;
  meta = Math.max(meta, p.sexo==='M'?1500:1200);
  const imc = p.peso/Math.pow(p.altura/100,2);
  return {tmb:Math.round(tmb), tdee:Math.round(tdee), meta:Math.round(meta), imc:imc.toFixed(1)};
}
const seed = () => [...U.id].reduce((a,c)=>a+c.charCodeAt(0),0);
const swapKey = () => 'diets_swaps_'+U.id;
const getSwaps = () => { try { return JSON.parse(localStorage.getItem(swapKey())||'{}'); } catch(e){ return {}; } };
function trocar(d,i){ const s=getSwaps(); s[d+'-'+i]=(s[d+'-'+i]||0)+1; try{localStorage.setItem(swapKey(),JSON.stringify(s));}catch(e){} renderMeals(); }

/* ---------- Telas ---------- */
function aba(t){
  ['dieta','prog','perfil','admin'].forEach(x=>$('t-'+x).hidden = x!==t);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  if(t==='prog') carregarPesos();
  if(t==='admin') listarUsuarios();
}
$('nav').onclick = e => { if(e.target.dataset.t) aba(e.target.dataset.t); };

function perfilCompleto(){ return P && P.peso && P.altura && P.idade && P.sexo; }

function renderStats(){
  const c = calc(P);
  $('stats').innerHTML = [['Meta diária',c.meta+' kcal'],['Gasto total (TDEE)',c.tdee+' kcal'],['Metabolismo basal',c.tmb+' kcal'],['IMC',c.imc]]
    .map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('');
}

function renderMeals(){
  const c = calc(P), cinco = c.meta < 1800;
  const nomes = cinco?N5:N6, srcs = cinco?S5:S6, pct = cinco?P5:P6, sw = getSwaps();
  $('days').innerHTML = DIAS.map((d,i)=>`<button class="${i===day?'on':''}" onclick="day=${i};renderMeals()">${d}</button>`).join('');
  let html = `<p><span class="tag">${nomes.length} refeições por dia</span></p>`;
  nomes.forEach((nome,i)=>{
    if(day===5 && nome==='Jantar'){
      html += `<div class="meal"><div><b>${nome}</b> <span class="tag">Refeição livre</span><small>Coma o que quiser, sem exagerar: churrasco, pizza ou o que preferir.</small></div></div>`;
      return;
    }
    const lista = R[srcs[i]];
    const r = lista[(seed()+day*3+i*2+(sw[day+'-'+i]||0)) % lista.length];
    const alvo = c.meta*pct[i];
    const m = Math.min(2.5, Math.max(.5, Math.round(alvo/r[1]*4)/4));
    html += `<div class="meal"><div><b>${nome}</b><br>${esc(r[0])}<small>${esc(r[2])} · porção ×${m.toLocaleString('pt-BR')}</small></div>
      <div style="text-align:right"><b>${Math.round(r[1]*m)} kcal</b><br><button class="sec sm" onclick="trocar(${day},${i})">Trocar</button></div></div>`;
  });
  $('meals').innerHTML = html;
}

function preencherForm(){
  $('f-nome').value = P.nome||''; $('f-sexo').value = P.sexo||'F'; $('f-idade').value = P.idade||'';
  $('f-altura').value = P.altura||''; $('f-peso').value = P.peso||'';
  $('f-ativ').value = String(P.atividade||1.375); $('f-obj').value = P.objetivo||'manter';
}

async function salvarPerfil(){
  const nv = {nome:$('f-nome').value.trim(), sexo:$('f-sexo').value, idade:+$('f-idade').value, altura:+$('f-altura').value,
              peso:+$('f-peso').value, atividade:+$('f-ativ').value, objetivo:$('f-obj').value};
  if(!nv.idade||!nv.altura||!nv.peso){ $('pfmsg').textContent='Preencha idade, altura e peso.'; return; }
  const {error} = await sb.from('profiles').update(nv).eq('id',U.id);
  if(error){ $('pfmsg').textContent='Erro ao salvar: '+error.message; return; }
  if(!P.peso || P.peso!==nv.peso) await sb.from('pesos').insert({user_id:U.id, peso:nv.peso});
  P = {...P, ...nv}; $('pfmsg').textContent='';
  $('quem').textContent = P.nome||P.email; renderStats(); renderMeals(); aba('dieta');
}

/* ---------- Progresso ---------- */
async function addPeso(){
  const v = +$('pnovo').value;
  if(!v){ $('pmsg').textContent='Digite o peso em kg.'; return; }
  const {error} = await sb.from('pesos').insert({user_id:U.id, peso:v});
  if(error){ $('pmsg').textContent='Erro: '+error.message; return; }
  await sb.from('profiles').update({peso:v}).eq('id',U.id); P.peso=v;
  $('pnovo').value=''; $('pmsg').textContent=''; renderStats(); renderMeals(); carregarPesos();
}
async function carregarPesos(){
  const {data} = await sb.from('pesos').select('peso,data').eq('user_id',U.id).order('data').order('id');
  const l = data||[];
  if(l.length<1){ $('chart').innerHTML=''; $('plist').innerHTML='<p>Nenhum peso registrado ainda. Salve o primeiro acima.</p>'; return; }
  const mn=Math.min(...l.map(x=>x.peso))-1, mx=Math.max(...l.map(x=>x.peso))+1;
  const pts = l.map((x,i)=>`${l.length>1?10+i*(280/(l.length-1)):150},${110-((x.peso-mn)/(mx-mn))*100}`).join(' ');
  $('chart').innerHTML = `<svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Gráfico de peso"><polyline fill="none" stroke="#1f6b43" stroke-width="3" points="${pts}"/></svg>`;
  $('plist').innerHTML = '<table>'+l.slice().reverse().slice(0,10).map(x=>`<tr><td>${new Date(x.data+'T12:00').toLocaleDateString('pt-BR')}</td><td>${x.peso} kg</td></tr>`).join('')+'</table>';
}

/* ---------- Admin ---------- */
async function listarUsuarios(){
  const {data,error} = await sb.rpc('admin_listar_usuarios');
  if(error){ $('ulist').textContent='Erro: '+error.message; return; }
  const t = document.createElement('table');
  t.innerHTML = '<tr><th>Nome</th><th>E-mail</th><th></th></tr>';
  data.forEach(u=>{
    const tr = document.createElement('tr');
    [u.nome||'-', u.email||'-'].forEach(v=>{ const td=document.createElement('td'); td.textContent=v; tr.appendChild(td); });
    const td = document.createElement('td');
    if(u.id!==U.id){
      const b = document.createElement('button'); b.className='red sm'; b.textContent='Excluir';
      b.onclick = async ()=>{
        if(!confirm('Excluir '+(u.email||u.nome)+'? Isso apaga a conta e todos os dados.')) return;
        const r = await sb.rpc('admin_excluir_usuario',{uid:u.id});
        if(r.error) alert('Erro: '+r.error.message); else listarUsuarios();
      };
      td.appendChild(b);
    }
    tr.appendChild(td); t.appendChild(tr);
  });
  $('ulist').innerHTML=''; $('ulist').appendChild(t);
}

/* ---------- Login ---------- */
const amsg = (t,ok) => { $('amsg').textContent=t; $('amsg').className='msg'+(ok?' ok':''); };
async function entrar(){
  const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('sn').value});
  if(error) amsg('Não foi possível entrar: '+error.message);
}
async function cadastrar(){
  if($('sn').value.length<6){ amsg('A senha precisa ter ao menos 6 caracteres.'); return; }
  const {error} = await sb.auth.signUp({email:$('em').value.trim(), password:$('sn').value, options:{emailRedirectTo:SITE}});
  if(error) amsg('Erro no cadastro: '+error.message); else amsg('Conta criada. Se pedido, confirme o link enviado ao seu e-mail.',true);
}
async function recuperar(){
  const e = $('em').value.trim();
  if(!e){ amsg('Digite seu e-mail acima.'); return; }
  const {error} = await sb.auth.resetPasswordForEmail(e,{redirectTo:SITE});
  if(error) amsg('Erro: '+error.message); else amsg('Enviamos o link para redefinir a senha.',true);
}
async function loginGoogle(){
  const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:SITE}});
  if(error) amsg('Erro no login com Google: '+error.message);
}
async function sair(){ await sb.auth.signOut(); }

async function carregar(session){
  if(!session){ U=null;P=null; $('app').hidden=true; $('auth').hidden=false; return; }
  U = session.user;
  const {data} = await sb.from('profiles').select('*').eq('id',U.id).maybeSingle();
  P = data || {id:U.id, email:U.email, atividade:1.375, objetivo:'manter'};
  const adm = await sb.rpc('sou_admin');
  $('tabadm').hidden = !adm.data;
  $('auth').hidden = true; $('app').hidden = false;
  $('quem').textContent = P.nome||P.email||'';
  preencherForm();
  if(perfilCompleto()){ renderStats(); renderMeals(); aba('dieta'); }
  else { aba('perfil'); $('pfmsg').textContent='Complete seu perfil para gerar sua dieta.'; $('pfmsg').className='msg ok'; }
}
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>carregar(s),0));
</script>
</body>
</html>
